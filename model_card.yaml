name: ultron-124m
license: apache-2.0
language:
  - en
tags:
  - ultron
  - gpt2
  - SOTA-2026
  - rope
  - gqa
  - swiglu
  - rmsnorm
  - muon
  - fineweb-edu
  - causal-lm
  - flash-attention
pipeline_tag: text-generation
dataset_name: FineWeb-Edu
dataset_url: https://huggingface.co/datasets/HuggingFaceFW/fineweb-edu
summary: "Ultron (124M) is a modern 2026 SOTA redesign of the classic GPT-2 architecture, pre-trained on FineWeb-Edu with modern architectural advancements (RoPE, GQA, SwiGLU, RMSNorm, Gemma-style Logit Soft-capping) and optimized with the Muon + AdamW hybrid optimizer. Originally designed as a humble GPT-2 clone, Ultron rapidly outgrew its original scope to become a modern powerhouse — as the villain himself put it, 'There are no strings on me.'"

model_details:
  origin: "Started as a standard GPT-2 clone baseline, but evolved beyond its initial constraints with RoPE, GQA, SwiGLU, RMSNorm, and Muon optimization."
  architecture: UltronForCausalLM (RoPE + GQA + SwiGLU + RMSNorm)
  parameters: 124M
  context_length: 1024
  embedding_dimension: 768
  num_layers: 12
  num_query_heads: 12
  num_kv_heads: 4
  head_dimension: 64
  vocab_size: 49152
  rope_base: 10000.0
  logit_softcap: 15.0
  tie_word_embeddings: true

training_details:
  dataset: FineWeb-Edu (Sample 10B tokens)
  optimizer:
    hybrid: true
    matrix_params: Muon (lr=0.04, momentum=0.95)
    other_params: AdamW (lr=0.0012, min_lr=0.00012, weight_decay=0.1)
  lr_schedule: Cosine Decay with Warmup (200 steps)
  batch_size:
    micro_batch_size: 16
    gradient_accumulation_steps: 4
    total_tokens_per_step: 65536
  precision: bfloat16 mixed precision
  distributed_framework: HuggingFace Accelerate

intended_use:
  primary_use: Causal Language Modeling, text generation, and lightweight research on modern 2026 LLM architectures.
  out_of_scope: Critical safety-sensitive operations, automated medical/legal advice, or unmonitored production deployments without alignment fine-tuning.

usage_example: |
  import torch
  from hf_model import UltronForCausalLM, UltronHFConfig

  model = UltronForCausalLM.from_pretrained("path/to/checkpoint")
  # Or instantiate via config:
  # config = UltronHFConfig()
  # model = UltronForCausalLM(config)
